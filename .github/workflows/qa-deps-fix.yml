name: QA-only dependency remediation
on:
  push:
    branches: [qa/regression-2026-11-23]
    paths: [.github/workflows/qa-deps-fix.yml]
permissions:
  contents: write
jobs:
  update-frontend-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned packages
        run: npm ci
        working-directory: frontend
      - name: Update compatible versions for all known advisories
        run: npm audit fix --package-lock-only --ignore-scripts
        working-directory: frontend
      - name: Install exact remediated lockfile
        run: npm ci
        working-directory: frontend
      - name: Reject remaining moderate or higher vulnerabilities
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Run frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend
      - name: Commit verified lockfile updates only on QA branch
        env:
          BRANCH: qa/regression-2026-11-23
        run: |
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): remediate audited frontend packages"
            git push origin "HEAD:$BRANCH"
          fi
