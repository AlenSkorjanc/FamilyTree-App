spring:
  application:
    name: family-tree-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_tree}
    username: ${DB_USERNAME:family_tree}
    password: ${DB_PASSWORD:family_tree}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  photo-storage:
    path: ${PHOTO_STORAGE_PATH:./data/photos}
