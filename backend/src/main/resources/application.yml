spring:
  application:
    name: family-tree-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_tree}
    username: ${DB_USERNAME:family_tree}
    password: ${DB_PASSWORD:family_tree}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:development-only-change-this-32-byte-secret}
    issuer: ${JWT_ISSUER:family-tree-api}
    audience: ${JWT_AUDIENCE:family-tree-web}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
  photo-storage:
    enabled: ${PHOTO_UPLOADS_ENABLED:true}
    path: ${PHOTO_STORAGE_PATH:./data/photos}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@familytree.local}
    verification-token-ttl: ${VERIFICATION_TOKEN_TTL:24h}
    password-token-ttl: ${PASSWORD_TOKEN_TTL:30m}
